name: reviewdog

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

# reviewdog が PR にコメントを書き込むための権限
permissions:
  contents: read
  pull-requests: write

jobs:
  rubocop:
    name: runner / rubocop
    runs-on: ubuntu-latest
    env:
      BUNDLE_ONLY: rubocop
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
      - uses: reviewdog/action-rubocop@v2
        with:
          reporter: github-pr-review
          skip_install: true
          use_bundler: true
